<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>GlassPanel</title>
<style>
  :root{ --v:#8b7fff; --c:#58c7ff; --g:#3ddc84; --a:#ffb020; --ink:#e8ecf1; --dim:#6b7688; }
  *{margin:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:radial-gradient(ellipse 70% 60% at 50% 42%,#0b1120 0%,#05070a 70%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
    font-family:'Space Grotesk','Segoe UI',system-ui,sans-serif;overflow:hidden;user-select:none}
  /* faint factory grid */
  body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
    background-image:linear-gradient(#141b28 1px,transparent 1px),linear-gradient(90deg,#141b28 1px,transparent 1px);
    background-size:34px 34px;-webkit-mask:radial-gradient(ellipse 60% 55% at 50% 45%,#000,transparent 75%);
            mask:radial-gradient(ellipse 60% 55% at 50% 45%,#000,transparent 75%)}

  .stage{position:relative;width:240px;height:240px;
    animation:rise 1s cubic-bezier(.16,1,.3,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(14px) scale(.82);filter:blur(9px)}
                  to{opacity:1;transform:none;filter:blur(0)}}

  svg{width:100%;height:100%;overflow:visible}
  .frame{fill:rgba(18,24,38,.55);stroke:url(#edge);stroke-width:2.5;
    filter:drop-shadow(0 8px 26px rgba(0,0,0,.5))}
  /* the frosted layer that clears -> "makes the system transparent" */
  .frost{fill:#aeb9e8;opacity:.9;animation:clear 1.15s cubic-bezier(.4,0,.2,1) .9s both}
  @keyframes clear{to{opacity:0}}
  /* glass reflection highlight */
  .reflect{fill:url(#gloss);opacity:.55}
  /* moving shine sweep */
  .shine{fill:#ffffff;opacity:0;animation:sweep 4.2s ease-in-out 1s infinite}
  @keyframes sweep{0%{opacity:0;transform:translateX(-140px) skewX(-18deg)}
    8%{opacity:.5}16%{opacity:0;transform:translateX(140px) skewX(-18deg)}100%{opacity:0;transform:translateX(140px) skewX(-18deg)}}

  /* the AI-model network revealed through the glass */
  .link{stroke-width:1.6;fill:none;stroke-linecap:round;opacity:0;
    stroke-dasharray:5 7;animation:show .5s ease .95s forwards, flow 1.4s linear 1s infinite}
  @keyframes show{to{opacity:.75}}
  @keyframes flow{to{stroke-dashoffset:-24}}
  .node{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.2,1.4,.4,1) forwards, pulse 2.4s ease-in-out infinite}
  @keyframes pop{to{opacity:1}}
  @keyframes pulse{0%,100%{filter:drop-shadow(0 0 2px currentColor)}50%{filter:drop-shadow(0 0 7px currentColor)}}
  .n1{animation-delay:1.0s,1.0s} .n2{animation-delay:1.12s,1.2s} .n3{animation-delay:1.24s,1.5s}
  .n4{animation-delay:1.36s,1.8s} .n5{animation-delay:1.48s,1.35s}

  .word{opacity:0;animation:up .8s cubic-bezier(.16,1,.3,1) 1.35s both;text-align:center}
  @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .word .t{font-weight:700;font-size:2.5rem;letter-spacing:-.01em;line-height:1;color:var(--ink)}
  .word .t .p{background:linear-gradient(92deg,var(--v),var(--c) 60%,var(--g));-webkit-background-clip:text;background-clip:text;color:transparent}
  .by{margin-top:9px;font:500 .74rem/1 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.34em;color:var(--dim);text-transform:uppercase;
    opacity:0;animation:up .8s ease 1.7s both}
  .by b{color:var(--c);font-weight:600}
  .tag{margin-top:5px;font-size:.72rem;color:#4a5262;opacity:0;animation:up .8s ease 1.95s both}
</style></head>
<body>
  <div class="stage">
    <svg viewBox="0 0 200 200" aria-label="GlassPanel logo">
      <defs>
        <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#a99bff"/><stop offset=".5" stop-color="#58c7ff"/><stop offset="1" stop-color="#3ddc84"/>
        </linearGradient>
        <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/><stop offset=".45" stop-color="#ffffff" stop-opacity="0"/>
        </linearGradient>
        <clipPath id="panel"><rect x="34" y="34" width="132" height="132" rx="26"/></clipPath>
      </defs>

      <!-- glass frame -->
      <rect class="frame" x="34" y="34" width="132" height="132" rx="26"/>

      <!-- inside the panel: the system, seen through the glass -->
      <g clip-path="url(#panel)">
        <!-- links -->
        <path class="link" d="M100 100 L66 64"  stroke="#8b7fff"/>
        <path class="link" d="M100 100 L138 70" stroke="#58c7ff"/>
        <path class="link" d="M100 100 L60 138" stroke="#3ddc84"/>
        <path class="link" d="M100 100 L142 134" stroke="#ffb020"/>
        <path class="link" d="M66 64 L138 70"   stroke="#58c7ff"/>
        <path class="link" d="M60 138 L142 134" stroke="#3ddc84"/>
        <!-- nodes (models working) -->
        <circle class="node n1" cx="100" cy="100" r="8.5" fill="#b7abff" color="#8b7fff"/>
        <circle class="node n2" cx="66"  cy="64"  r="5.5" fill="#8b7fff" color="#8b7fff"/>
        <circle class="node n3" cx="138" cy="70"  r="5.5" fill="#58c7ff" color="#58c7ff"/>
        <circle class="node n4" cx="60"  cy="138" r="5.5" fill="#3ddc84" color="#3ddc84"/>
        <circle class="node n5" cx="142" cy="134" r="5.5" fill="#ffb020" color="#ffb020"/>
        <!-- frosted layer that clears to reveal the above -->
        <rect class="frost" x="34" y="34" width="132" height="132" rx="26"/>
      </g>

      <!-- reflection + shine on the glass -->
      <path class="reflect" d="M34 60 Q34 34 60 34 L120 34 L60 166 L34 166 Z" clip-path="url(#panel)"/>
      <g clip-path="url(#panel)"><rect class="shine" x="20" y="30" width="34" height="140"/></g>
    </svg>
  </div>

  <div>
    <div class="word"><div class="t">Glass<span class="p">Panel</span></div></div>
    <div class="by">by <b>Ooru&nbsp;Logix</b></div>
    <div class="tag" style="text-align:center">see every model working · one transparent control plane</div>
  </div>
</body></html>
